<div class="auth-page">
  <div class="auth-panel-form">
    <div class="auth-form-wrap">
      <div class="auth-brand-icon">N</div>
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Set up your Notepad account to start writing.</p>

      <form class="auth-form" @submit.prevent="onSubmit">
        <div class="form-grid">
          <div class="form-field">
            <label for="firstName" class="form-label">First name</label>
            <input
              id="firstName"
              v-model="firstName"
              type="text"
              class="form-input"
              placeholder="Grace"
              autocomplete="given-name"
              required
            />
          </div>

          <div class="form-field">
            <label for="lastName" class="form-label">Last name</label>
            <input
              id="lastName"
              v-model="lastName"
              type="text"
              class="form-input"
              placeholder="Hopper"
              autocomplete="family-name"
              required
            />
          </div>
        </div>

        <div class="form-field">
          <label for="username" class="form-label">Username</label>
          <input
            id="username"
            v-model="username"
            type="text"
            class="form-input"
            placeholder="gracehopper"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-field">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            v-model="email"
            type="email"
            class="form-input"
            placeholder="grace@org.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label for="phoneNumber" class="form-label">Phone number</label>
          <input
            id="phoneNumber"
            v-model="phoneNumber"
            type="tel"
            class="form-input"
            placeholder="+1 555 010 1234"
            autocomplete="tel"
          />
        </div>

        <div class="form-field">
          <label for="password" class="form-label">Password</label>
          <div class="password-field">
            <input
              id="password"
              v-model="password"
              :type="showPassword ? 'text' : 'password'"
              class="form-input"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              @click="showPassword = !showPassword"
            >
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <div class="form-field">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <div class="password-field">
            <input
              id="confirmPassword"
              v-model="confirmPassword"
              :type="showConfirmPassword ? 'text' : 'password'"
              class="form-input"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              @click="showConfirmPassword = !showConfirmPassword"
            >
              {{ showConfirmPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <p v-if="error" class="form-error">
          <span class="form-error__icon">!</span> {{ error }}
        </p>

        <button type="submit" class="btn-primary" :disabled="loading">
          {{ loading ? 'Creating account...' : 'Create account' }}
        </button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <router-link to="/login" class="link-muted">Sign in</router-link>
      </p>
    </div>

    <p class="auth-footer">
      By continuing, you agree to our <a href="#">Terms of Service</a> and
      <a href="#">Privacy Policy</a>.
    </p>
  </div>

  <div class="auth-panel-showcase">
    <div class="showcase-content">
      <h2 class="showcase-title">Write &amp; Organize &amp; Sync.</h2>
      <p class="showcase-subtitle">Capture your ideas and access them anywhere.</p>

      <div class="node-diagram">
        <svg class="node-diagram__lines" viewBox="0 0 360 360">
          <line x1="180" y1="180" x2="45" y2="45" />
          <line x1="180" y1="180" x2="180" y2="45" />
          <line x1="180" y1="180" x2="315" y2="45" />
          <line x1="180" y1="180" x2="45" y2="180" />
          <line x1="180" y1="180" x2="315" y2="180" />
          <line x1="180" y1="180" x2="45" y2="315" />
          <line x1="180" y1="180" x2="180" y2="315" />
          <line x1="180" y1="180" x2="315" y2="315" />
        </svg>

        <div class="node-diagram__grid">
          <div class="node node--light">∞</div>
          <div class="node node--dark">▤</div>
          <div class="node node--light">◈</div>
          <div class="node node--dark">◉</div>
          <div class="node node--center">N</div>
          <div class="node node--dark">▥</div>
          <div class="node node--light">✻</div>
          <div class="node node--dark">$</div>
          <div class="node node--light">))</div>
        </div>
      </div>
    </div>

    <div class="pagination-dots">
      <span class="dot"></span>
      <span class="dot dot--active"></span>
      <span class="dot"></span>
    </div>
  </div>
</div>
