services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - env/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  notepad-backend:
    build:
      context: ./notepad-backend
      dockerfile: Dockerfile
    env_file:
      - env/.env
    volumes:
      - ./env/appsettings.json:/app/appsettings.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notepad-frontend:
    build:
      context: ./notepad-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - "5173:80"
    depends_on:
      - notepad-backend
    restart: unless-stopped

volumes:
  postgres-data:
